# NGINX DA SHELL - Serve SPA Vite com cache correto
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota (/posts, /users) cai em index.html, roteamento é do JS
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionados (js/css/img) - cache 1 ano imutável, com CORS para permitir se outro app buscar
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # index.html nunca cacheado - garante que novo deploy é visto no F5
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
